# The Grammar Line – Netlify-Konfiguration
[build]
  # Kein Build-Schritt nötig: Die Webseite liegt fertig im Ordner "public".
  publish = "public"
  command = "echo 'Kein Build nötig'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
